<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créer un compte — PC-INFORMATIQUE</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --text:#151824; --muted:#6b7280;
    --primary:#2454ff; --primary-dark:#173bd1; --border:#e2e5ea;
    --danger:#dc2626; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:24px;
  }
  .card{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px 28px;
  }
  h1{font-size:22px; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 24px;}
  label{display:block; font-size:13px; font-weight:600; margin:16px 0 6px;}
  input{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:15px; background:#fbfbfc;
  }
  input:focus{outline:2px solid var(--primary); outline-offset:1px; background:#fff;}
  button{
    width:100%; margin-top:24px; padding:12px; border:none; border-radius:8px;
    background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--primary-dark);}
  button:disabled{opacity:.6; cursor:default;}
  .msg{font-size:13px; margin-top:14px; padding:10px 12px; border-radius:8px; display:none;}
  .msg.err{display:block; background:#fef2f2; color:var(--danger);}
  .msg.ok{display:block; background:#f0fdf4; color:#16a34a;}
  .foot{margin-top:20px; font-size:13px; color:var(--muted); text-align:center;}
  .foot a{color:var(--primary); text-decoration:none; font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <h1>Créer un compte</h1>
    <p class="sub">Rejoins l'espace membres PC-INFORMATIQUE.</p>

    <label for="nom">Nom complet</label>
    <input id="nom" type="text" autocomplete="name" placeholder="Votre nom">

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="vous@exemple.com">

    <label for="pass">Mot de passe</label>
    <input id="pass" type="password" autocomplete="new-password" placeholder="6 caractères minimum">

    <label for="pass2">Confirmer le mot de passe</label>
    <input id="pass2" type="password" autocomplete="new-password" placeholder="Retapez le mot de passe">

    <button id="btn-submit">Créer mon compte</button>
    <div class="msg" id="msg"></div>

    <div class="foot">Déjà membre ? <a href="connexion.html">Se connecter</a></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey:"AIzaSyCx2D6b8TFGW-GBxb25t4MUqpoQj_cQCtk", authDomain:"pc-informatique-site.firebaseapp.com", projectId:"pc-informatique-site", storageBucket:"pc-informatique-site.firebasestorage.app", messagingSenderId:"43208715297", appId:"1:43208715297:web:02e946d321ae3a31ab0760" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const msgEl = document.getElementById('msg');
function showMsg(text, ok){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
}

function translateError(code){
  const map = {
    'auth/email-already-in-use':"Un compte existe déjà avec cet e-mail.",
    'auth/invalid-email':"Adresse e-mail invalide.",
    'auth/weak-password':"Mot de passe trop court (6 caractères minimum).",
  };
  return map[code] || "Erreur : impossible de créer le compte.";
}

document.getElementById('btn-submit').addEventListener('click', async ()=>{
  const nom = document.getElementById('nom').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const pass2 = document.getElementById('pass2').value;
  const btn = document.getElementById('btn-submit');

  if(!nom){ showMsg("Merci d'indiquer votre nom.", false); return; }
  if(!email){ showMsg("Merci d'indiquer votre e-mail.", false); return; }
  if(pass.length < 6){ showMsg("Le mot de passe doit faire 6 caractères minimum.", false); return; }
  if(pass !== pass2){ showMsg("Les mots de passe ne correspondent pas.", false); return; }

  btn.disabled = true; btn.textContent = "Création en cours…";
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('membres').doc(cred.user.uid).set({
      nom, email, bio:"", photoURL:"",
      actif:true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showMsg("Compte créé ! Redirection…", true);
    setTimeout(()=> location.href = 'profil.html', 800);
  }catch(err){
    showMsg(translateError(err.code), false);
    btn.disabled = false; btn.textContent = "Créer mon compte";
  }
});

auth.onAuthStateChanged(user=>{
  if(user) location.href = 'profil.html';
});
</script>
</body>
</html>
