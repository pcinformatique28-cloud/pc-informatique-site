<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --text:#151824; --muted:#6b7280;
    --teal:#33d9c4; --pink:#ff4fa3;
    --primary:#0e9488; --primary-dark:#ff4fa3; --border:#e2e5ea;
    --danger:#dc2626; --success:#16a34a; --warn:#b45309; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  }
  header{
    position:relative; background:var(--surface); border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  header .brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
  .head-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  header .brand{font-weight:700; font-size:15px;}
  header::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--pink));}
  header button{
    background:none; border:1px solid var(--border); border-radius:8px; padding:8px 10px;
    font-size:12px; cursor:pointer; color:var(--muted);
  }
  header button:hover{color:var(--danger); border-color:var(--danger);}
  main{max-width:640px; margin:0 auto; padding:24px 16px 60px;}
  .card{background:linear-gradient(180deg,#ffffff,#f4fffb);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--pink));}
  .card h2{color:#0e9488;}
  h2{font-size:16px; margin:0 0 16px;}
  .photo-row{display:flex; align-items:center; gap:16px; margin-bottom:20px;}
  .avatar{
    width:84px; height:84px; border-radius:50%; object-fit:cover; background:#e2e5ea;
    border:1px solid var(--border); flex-shrink:0;
  }
  .photo-actions label{
    display:inline-block; background:linear-gradient(90deg,var(--teal),var(--pink)); color:#0d0f16; padding:8px 14px;
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .photo-actions label:hover{background:var(--primary-dark);}
  .photo-actions input[type=file]{display:none;}
  .photo-actions .hint{font-size:12px; color:var(--muted); margin-top:6px;}
  label.field{display:block; font-size:13px; font-weight:600; margin:14px 0 6px;}
  input,textarea,select{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; background:#fbfbfc; font-family:inherit;
  }
  textarea{resize:vertical; min-height:80px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--teal); outline-offset:1px; background:#fff;}
  .btn{
    padding:10px 16px; border:none; border-radius:8px; font-size:14px; font-weight:700;
    cursor:pointer; background:linear-gradient(90deg,var(--teal),var(--pink)); color:#0d0f16;
    box-shadow:0 2px 8px rgba(51,217,196,.35);
  }
  .btn:hover{background:var(--primary-dark);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-outline{background:none; border:1px solid var(--border); color:var(--text);}
  .btn-outline:hover{border-color:var(--primary); color:var(--primary);}
  .btn-danger{background:none; color:var(--danger); border:1px solid transparent; padding:6px 10px; font-size:12px;}
  .btn-danger:hover{background:#fef2f2;}
  .bell{position:relative;font-size:1.05rem;color:#0e9488;cursor:pointer;display:inline-flex;}
  .bell-badge{position:absolute;top:-6px;right:-10px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;border-radius:10px;padding:1px 5px;line-height:1;}
  .msg{font-size:13px; margin-top:12px; padding:9px 12px; border-radius:8px; display:none;}
  .msg.err{display:block; background:#fef2f2; color:var(--danger);}
  .msg.ok{display:block; background:#f0fdf4; color:var(--success);}
  .proj{border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px;}
  .proj-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .proj-title{font-weight:700; font-size:14px;}
  .proj-desc{font-size:13px; color:var(--muted); margin-top:4px; white-space:pre-wrap;}
  .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
  .badge.en_attente{background:#fffbeb; color:var(--warn);}
  .badge.valide{background:#e6fbf8; color:#0e9488;}
  .badge.refuse{background:#fef2f2; color:var(--danger);}
  .badge.type{background:#ffe9f4; color:#c2367f; margin-left:6px;}
  .proj img{max-width:100%; border-radius:6px; margin-top:8px; display:block;}
  .proj a.lien{font-size:12px; color:var(--primary); display:inline-block; margin-top:6px;}
  .empty{font-size:13px; color:var(--muted); text-align:center; padding:20px 0;}
  #loading{text-align:center; padding:60px 0; color:var(--muted);}
  body{background:linear-gradient(160deg,#eaf2ff 0%,#dce8ff 100%) !important;}
  input[readonly],textarea[readonly]{background:transparent !important;border-color:transparent !important;color:var(--text);cursor:default;}
  .profil-head{display:flex;align-items:center;justify-content:space-between;}
  .edit-icon{background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:6px;}
  .edit-icon:hover{color:var(--primary);background:#f0fdfb;}

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = { apiKey:"AIzaSyCx2D6b8TFGW-GBxb25t4MUqpoQj_cQCtk", authDomain:"pc-informatique-site.firebaseapp.com", projectId:"pc-informatique-site", storageBucket:"pc-informatique-site.firebasestorage.app", messagingSenderId:"43208715297", appId:"1:43208715297:web:02e946d321ae3a31ab0760" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CLOUD_NAME = "zbof0xbh";
const UPLOAD_PRESET = "pc_membres";
const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84'><rect width='84' height='84' fill='%23e2e5ea'/></svg>";
let currentUser = null;
let editingProjetId = null;

async function uploadToCloudinary(file){
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:'POST', body: fd });
  if(!res.ok) throw new Error('Échec upload Cloudinary');
  const data = await res.json();
  return data.secure_url;
}

function showMsg(el, text, ok){
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadProfil(){
  const doc = await db.collection('membres').doc(currentUser.uid).get();
  const d = doc.data() || {};
  document.getElementById('nom').value = d.nom || '';
  document.getElementById('bio').value = d.bio || '';
  document.getElementById('avatar').src = d.photoURL || DEFAULT_AVATAR;
  setProfilEditMode(!d.nom);
}

function setProfilEditMode(on){
  const nom = document.getElementById('nom');
  const bio = document.getElementById('bio');
  const btnSave = document.getElementById('btn-save-profil');
  const btnEdit = document.getElementById('btn-edit-profil');
  nom.readOnly = !on;
  bio.readOnly = !on;
  btnSave.parentElement.style.display = on ? '' : 'none';
  btnEdit.style.display = on ? 'none' : '';
}

document.getElementById('btn-edit-profil').addEventListener('click', ()=> setProfilEditMode(true));

document.getElementById('photo-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const label = document.getElementById('photo-label');
  const original = label.textContent;
  label.textContent = "Envoi…";
  try{
    const url = await uploadToCloudinary(file);
    await db.collection('membres').doc(currentUser.uid).set({ photoURL: url }, { merge: true });
    document.getElementById('avatar').src = url;
  }catch(err){
    console.error(err);
    alert("Erreur upload: " + (err && err.message ? err.message : err));
  }finally{
    label.textContent = original;
    e.target.value = '';
  }
});

document.getElementById('btn-save-profil').addEventListener('click', async ()=>{
  const btn = document.getElementById('btn-save-profil');
  const msg = document.getElementById('msg-profil');
  const nom = document.getElementById('nom').value.trim();
  const bio = document.getElementById('bio').value.trim();
  if(!nom){ showMsg(msg, "Le nom ne peut pas être vide.", false); return; }
  btn.disabled = true;
  try{
    await db.collection('membres').doc(currentUser.uid).set({ nom, bio }, { merge: true });
    showMsg(msg, "Profil mis à jour.", true);
    setProfilEditMode(false);
  }catch(err){
    showMsg(msg, "Erreur lors de l'enregistrement.", false);
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('btn-add-projet').addEventListener('click', async ()=>{
  const btn = document.getElementById('btn-add-projet');
  const msg = document.getElementById('msg-projet');
  const titre = document.getElementById('p-titre').value.trim();
  const type = document.getElementById('p-type').value;
  const description = document.getElementById('p-desc').value.trim();
  const lien = document.getElementById('p-lien').value.trim();
  const fileInput = document.getElementById('p-image');

  if(!titre){ showMsg(msg, "Le titre est obligatoire.", false); return; }

  btn.disabled = true; btn.textContent = "Envoi…";
  try{
    let imageURL = "";
    if(fileInput.files[0]){
      imageURL = await uploadToCloudinary(fileInput.files[0]);
    }
    if(editingProjetId){
      const update = { titre, description, type, lien };
      if(imageURL) update.imageURL = imageURL;
      await db.collection('projets').doc(editingProjetId).update(update);
      showMsg(msg, "Projet mis à jour.", true);
      editingProjetId = null;
      document.getElementById('btn-add-projet').textContent = 'Envoyer pour validation';
    } else {
      await db.collection('projets').add({
        membreId: currentUser.uid,
        titre, description, type, lien, imageURL,
        statut: 'en_attente',
        vu: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      showMsg(msg, "Projet envoyé, en attente de validation par l'admin.", true);
    }
    document.getElementById('p-titre').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-lien').value = '';
    fileInput.value = '';
    loadProjets();
  }catch(err){
    showMsg(msg, "Erreur lors de l'envoi du projet.", false);
  }finally{
    btn.disabled = false; btn.textContent = "Envoyer pour validation";
  }
});

async function loadProjets(){
  const list = document.getElementById('projets-list');
  const snap = await db.collection('projets').where('membreId','==', currentUser.uid).get();
  const projets = [];
  snap.forEach(doc => projets.push({ id: doc.id, ...doc.data() }));
  projets.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

  if(projets.length === 0){
    list.innerHTML = '<div class="empty">Aucun projet pour l\'instant.</div>';
    return;
  }

  const statutLabel = { en_attente:"En attente", valide:"Validé", refuse:"Refusé" };
  const typeLabel = { personnel:"Personnel", collaboration:"Collaboration" };

  list.innerHTML = projets.map(p => `
    <div class="proj">
      <div class="proj-top">
        <div>
          <span class="proj-title">${escapeHtml(p.titre)}</span>
          <span class="badge type">${typeLabel[p.type]||p.type}</span>
        </div>
        <span class="badge ${p.statut}">${statutLabel[p.statut]||p.statut}</span>
      </div>
      ${p.description ? `<div class="proj-desc">${escapeHtml(p.description)}</div>` : ''}
      ${p.imageURL ? `<img src="${p.imageURL}" alt="" style="cursor:pointer;" data-edit-id="${p.id}">` : ''}
      ${p.lien ? `<a class="lien" href="${escapeHtml(p.lien)}" target="_blank" rel="noopener">${escapeHtml(p.lien)}</a><br>` : ''}
      <button class="btn-danger" data-id="${p.id}">Supprimer</button>
      ${p.statut === 'en_attente' ? `<button class="btn-edit-projet" data-id="${p.id}" style="background:#2dd4bf;color:#0d0f16;font-weight:700;border:none;border-radius:8px;padding:8px 14px;margin-left:8px;cursor:pointer;">Modifier</button>` : ''}
    </div>
  `).join('');

  list.querySelectorAll('.btn-danger').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Supprimer ce projet ?')) return;
      await db.collection('projets').doc(btn.dataset.id).delete();
      loadProjets();
    });
  });

  list.querySelectorAll('img[data-edit-id]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const p = projets.find(x => x.id === img.dataset.editId);
      if(!p) return;
      editingProjetId = p.id;
      document.getElementById('p-titre').value = p.titre || '';
      document.getElementById('p-type').value = p.type || 'personnel';
      document.getElementById('p-desc').value = p.description || '';
      document.getElementById('p-lien').value = p.lien || '';
      document.getElementById('btn-add-projet').textContent = 'Enregistrer les modifications';
      document.getElementById('p-titre').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });

  list.querySelectorAll('.btn-edit-projet').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const p = projets.find(x => x.id === btn.dataset.id);
      if(!p) return;
      editingProjetId = p.id;
      document.getElementById('p-titre').value = p.titre || '';
      document.getElementById('p-type').value = p.type || 'personnel';
      document.getElementById('p-desc').value = p.description || '';
      document.getElementById('p-lien').value = p.lien || '';
      document.getElementById('btn-add-projet').textContent = 'Enregistrer les modifications';
      document.getElementById('p-titre').scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
}

document.getElementById('btn-logout').addEventListener('click', async ()=>{
  const btn = document.getElementById('btn-logout');
  btn.disabled = true;
  btn.textContent = 'Déconnexion...';
  try{
    await auth.signOut();
    location.href = 'index.html';
  }catch(err){
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Déconnexion';
    alert("Erreur lors de la déconnexion, réessaie.");
  }
});

auth.onAuthStateChanged(async user=>{
  if(!user){ location.href = 'connexion.html'; return; }
  currentUser = user;
  try{
    await loadProfil();
    await loadProjets();
    startMemberNotifs();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }catch(err){
    console.error(err);
    document.getElementById('loading').textContent = "Erreur: " + (err && err.message ? err.message : err);
  }
});

let unseenNotifCount = 0;
function startMemberNotifs(){
  db.collection('projets').where('membreId','==',currentUser.uid).where('vu','==', false)
    .onSnapshot(snap=>{
      unseenNotifCount = snap.size;
      updateProfilBell();
    });
}
function updateProfilBell(){
  const badge = document.getElementById('profil-bell-badge');
  if(!badge) return;
  if(unseenNotifCount>0){ badge.textContent = unseenNotifCount; badge.style.display='inline-block'; }
  else{ badge.style.display='none'; }
}
document.getElementById('profil-bell').addEventListener('click', async ()=>{
  const snap = await db.collection('projets').where('membreId','==',currentUser.uid).where('vu','==', false).get();
  const batch = db.batch();
  snap.forEach(doc=> batch.update(doc.ref, { vu:true }));
  if(!snap.empty) await batch.commit();
  document.getElementById('projets-list').scrollIntoView({behavior:'smooth', block:'start'});
});
</script>
<script>/*PATCH-MENU-PROFIL*/
(function(){
function light(){return document.documentElement.getAttribute('data-theme')==='light'}
var css=document.createElement('style');
css.textContent='#pm-btn{position:fixed;top:78px;left:10px;z-index:9000;width:40px;height:40px;border-radius:50%;border:2px solid #33d9c4;background:#12142b;color:#fff;font-size:20px;cursor:pointer;line-height:1}'

var btn=document.createElement('button');btn.id='pm-btn';btn.type='button';btn.setAttribute('aria-label','Menu');btn.textContent='\u2630';
var ov=document.createElement('div');ov.id='pm-ov';
var dr=document.createElement('aside');dr.id='pm-dr';
var x=document.createElement('button');x.id='pm-x';x.type='button';x.textContent='\u00d7';dr.appendChild(x);
var nav=document.createElement('nav');nav.style.clear='both';dr.appendChild(nav);
function add(href,ic,label,id,hidden){var a=document.createElement('a');a.href=href;if(id)a.id=id;if(hidden)a.style.display='none';
 var i=document.createElement('span');i.textContent=ic;a.appendChild(i);a.appendChild(document.createTextNode(label));nav.appendChild(a);return a}
add('index.html','\uD83C\uDFE0','Accueil');
add('profil.html','\uD83D\uDC64','Mon profil');
var adm=add('admin.html','\u2699','Tableau de bord','pm-admin',true);
add('index.html#realisations','\uD83D\uDCC1','R\u00e9alisations');
add('index.html#demande','\u2795','Nouvelle demande');
add('index.html','\uD83D\uDD14','Param\u00e8tres notifications (accueil)');
add('index.html','\uD83C\uDF10','Langue / Language (accueil)');
var out=add('#','\uD83D\uDEAA','D\u00e9connexion','pm-out',true);out.style.color='#ff6b6b';
var th=add('#','\uD83C\uDF19','Mode clair','pm-theme');
function lab(){th.lastChild.nodeValue=light()?'Mode sombre':'Mode clair';th.firstChild.textContent=light()?'\u2600':'\uD83C\uDF19'}
th.onclick=function(e){e.preventDefault();var l=!light();if(l)document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('pcinfo-theme',l?'light':'dark')}catch(er){}lab()};
lab();
function openM(){dr.classList.add('open');ov.classList.add('open')}
function closeM(){dr.classList.remove('open');ov.classList.remove('open')}
btn.onclick=openM;ov.onclick=closeM;x.onclick=closeM;
function mount(){document.body.appendChild(btn);document.body.appendChild(ov);document.body.appendChild(dr)}
if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount);
function wire(){try{firebase.auth().onAuthStateChanged(function(u){
 out.style.display=u?'flex':'none';
 if(u){try{firebase.firestore().collection('admins').doc(u.uid).get().then(function(d){adm.style.display=d.exists?'flex':'none'}).catch(function(){})}catch(e){}}
 else adm.style.display='none'})}catch(e){}}
out.onclick=function(e){e.preventDefault();try{firebase.auth().signOut().then(function(){location.href='index.html'})}catch(er){location.href='index.html'}};
if(window.firebase&&firebase.auth)wire();else window.addEventListener('load',function(){if(window.firebase)wire()});
})();</script>
