<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — PC-INFORMATIQUE</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --text:#151824; --muted:#6b7280;
    --primary:#2454ff; --primary-dark:#173bd1; --border:#e2e5ea;
    --danger:#dc2626; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    padding:24px;
  }
  .card{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px 28px;
  }
  h1{font-size:22px; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 24px;}
  label{display:block; font-size:13px; font-weight:600; margin:16px 0 6px;}
  input{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:15px; background:#fbfbfc;
  }
  input:focus{outline:2px solid var(--primary); outline-offset:1px; background:#fff;}
  button{
    width:100%; margin-top:24px; padding:12px; border:none; border-radius:8px;
    background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--primary-dark);}
  button:disabled{opacity:.6; cursor:default;}
  .link-row{display:flex; justify-content:flex-end; margin-top:8px;}
  .link-row a{font-size:13px; color:var(--muted); text-decoration:none;}
  .link-row a:hover{color:var(--primary);}
  .msg{font-size:13px; margin-top:14px; padding:10px 12px; border-radius:8px; display:none;}
  .msg.err{display:block; background:#fef2f2; color:var(--danger);}
  .msg.ok{display:block; background:#f0fdf4; color:#16a34a;}
  .foot{margin-top:20px; font-size:13px; color:var(--muted); text-align:center;}
  .foot a{color:var(--primary); text-decoration:none; font-weight:600;}
  body{background:linear-gradient(160deg,#eafbf8 0%,#fdeef6 100%) !important;}
  .card{position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(20,24,40,.08) !important;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#33d9c4,#ff4fa3);}
  input{background:#f4fbfa !important;}
  input:focus{outline:2px solid #33d9c4 !important;}
  button{background:linear-gradient(90deg,#33d9c4,#ff4fa3) !important;color:#0d0f16 !important;font-weight:700;box-shadow:0 2px 8px rgba(51,217,196,.35);}
  .msg.ok{background:#e6fbf8 !important;color:#0e9488 !important;}
  .msg.err{background:#fdeef1 !important;}
  body{background:linear-gradient(160deg,#eafbf8 0%,#fdeef6 100%) !important;}
  .card{position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(20,24,40,.08) !important;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#33d9c4,#ff4fa3);}
  input{background:#f4fbfa !important;}
  input:focus{outline:2px solid #33d9c4 !important;}
  button{background:linear-gradient(90deg,#33d9c4,#ff4fa3) !important;color:#0d0f16 !important;font-weight:700;box-shadow:0 2px 8px rgba(51,217,196,.35);}
  .msg.ok{background:#e6fbf8 !important;color:#0e9488 !important;}
  .msg.err{background:#fdeef1 !important;}
</style>
</head>
<body>
  <div class="card">
    <h1>Connexion</h1>
    <p class="sub">Accède à ton espace membre PC-INFORMATIQUE.</p>

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="username" placeholder="vous@exemple.com">

    <label for="pass">Mot de passe</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Votre mot de passe">
    <div class="link-row"><a href="#" id="btn-reset">Mot de passe oublié ?</a></div>

    <button id="btn-submit">Se connecter</button>
    <div class="msg" id="msg"></div>

    <div class="foot">Pas encore de compte ? <a href="inscription.html">S'inscrire</a></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = { apiKey:"AIzaSyCx2D6b8TFGW-GBxb25t4MUqpoQj_cQCtk", authDomain:"pc-informatique-site.firebaseapp.com", projectId:"pc-informatique-site", storageBucket:"pc-informatique-site.firebasestorage.app", messagingSenderId:"43208715297", appId:"1:43208715297:web:02e946d321ae3a31ab0760" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const msgEl = document.getElementById('msg');
function showMsg(text, ok){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
}

document.getElementById('btn-submit').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('btn-submit');
  if(!email || !pass){ showMsg("Merci de remplir e-mail et mot de passe.", false); return; }

  btn.disabled = true; btn.textContent = "Connexion…";
  try{
    await auth.signInWithEmailAndPassword(email, pass);
    location.href = 'profil.html';
  }catch(err){
    const code = err.code;
    const text = (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found')
      ? "E-mail ou mot de passe incorrect."
      : "Erreur de connexion : " + err.message;
    showMsg(text, false);
    btn.disabled = false; btn.textContent = "Se connecter";
  }
});

document.getElementById('btn-reset').addEventListener('click', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if(!email){ showMsg("Indique ton e-mail dans le champ ci-dessus d'abord.", false); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    showMsg("E-mail de réinitialisation envoyé.", true);
  }catch(err){
    showMsg("Aucun compte trouvé avec cet e-mail.", false);
  }
});

auth.onAuthStateChanged(user=>{
  if(user) location.href = 'profil.html';
});
</script>
</body>
</html>
