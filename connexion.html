<script>
const firebaseConfig = { apiKey:"AIzaSyCx2D6b8TFGW-GBxb25t4MUqpoQj_cQCtk", authDomain:"pc-informatique-site.firebaseapp.com", projectId:"pc-informatique-site", storageBucket:"pc-informatique-site.firebasestorage.app", messagingSenderId:"43208715297", appId:"1:43208715297:web:02e946d321ae3a31ab0760" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const ADMIN_UID = "QFC18HxRAZabqYD85S5eA7VLC5D3";

const msgEl = document.getElementById('msg');
function showMsg(text, ok){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
}

document.getElementById('btn-submit').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('btn-submit');
  if(!email || !pass){ showMsg("Merci de remplir e-mail et mot de passe.", false); return; }

  btn.disabled = true; btn.textContent = "Connexion…";
  try{
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    location.href = 'profil.html';
  }catch(err){
    const code = err.code;
    const text = (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found')
      ? "E-mail ou mot de passe incorrect."
      : "Erreur de connexion : " + err.message;
    showMsg(text, false);
    btn.disabled = false; btn.textContent = "Se connecter";
  }
});

document.getElementById('btn-reset').addEventListener('click', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if(!email){ showMsg("Indique ton e-mail dans le champ ci-dessus d'abord.", false); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    showMsg("E-mail de réinitialisation envoyé.", true);
  }catch(err){
    showMsg("Aucun compte trouvé avec cet e-mail.", false);
  }
});

auth.onAuthStateChanged(user=>{
  if(user) location.href = 'profil.html';
});
</script>

<script>
(function(){
  document.addEventListener('DOMContentLoaded', function(){
    var drawer = document.getElementById('drawer');
    var overlay = document.getElementById('drawer-overlay');
    var btnMenu = document.getElementById('btn-menu');
    var drawerClose = document.getElementById('drawer-close');
    function openDrawer(){ drawer.classList.add('open'); overlay.classList.add('open'); }
    function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }
    if(btnMenu) btnMenu.addEventListener('click', openDrawer);
    if(drawerClose) drawerClose.addEventListener('click', closeDrawer);
    if(overlay) overlay.addEventListener('click', closeDrawer);

    var dLogout = document.getElementById('drawer-logout');
    if(dLogout){
      dLogout.addEventListener('click', function(e){
        e.preventDefault();
        auth.signOut().then(function(){ closeDrawer(); location.href='index.html'; });
      });
    }

    var bottomNav = document.querySelector('.bottom-nav');
    if(bottomNav){
      var indicator = document.createElement('span');
      indicator.className = 'bn-indicator';
      bottomNav.appendChild(indicator);
      var active = bottomNav.querySelector('a.active');
      if(active){
        var rect = active.getBoundingClientRect();
        var parentRect = bottomNav.getBoundingClientRect();
        indicator.style.left = (rect.left - parentRect.left) + 'px';
        indicator.style.width = rect.width + 'px';
      }
    }

    auth.onAuthStateChanged(function(user){
      if(user){
        var du = document.getElementById('drawer-user');
        if(du) du.style.display = 'flex';
        var dn = document.getElementById('drawer-name'); if(dn) dn.textContent = user.displayName || 'Membre';
        var de = document.getElementById('drawer-email'); if(de) de.textContent = user.email || '';
        var dp = document.getElementById('drawer-profil'); if(dp) dp.style.display = 'flex';
        var dl = document.getElementById('drawer-login'); if(dl) dl.style.display = 'none';
        if(dLogout) dLogout.style.display = 'flex';
        var authIcon = document.getElementById('auth-icon');
        if(authIcon){ authIcon.href = 'profil.html'; authIcon.innerHTML = '&#128100;'; }
      }
    });
  });
})();
</script>
