<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC-INFORMATIQUE — Admin</title>
<style>
:root{
  --bg:#0d0f16; --card:#141826; --text:#f2f3f7; --sub:#9aa1b4;
  --teal:#33d9c4; --pink:#ff4fa3; --ok:#5ee06a; --bad:#ff5c5c; --wait:#f2c94c;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
a{color:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px;}
nav{position:sticky;top:0;z-index:20;background:rgba(13,15,22,.94);backdrop-filter:blur(6px);border-bottom:1px solid #1e2338;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;}
.navwrap{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.navwrap b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navwrap .headright{display:flex;align-items:center;gap:10px;flex-shrink:0;}
#count{background:rgba(255,255,255,.06);padding:3px 9px;border-radius:20px;}
.navwrap b{font-size:.95rem;}
.bell{position:relative;font-size:1.05rem;color:#fff;cursor:default;display:inline-flex;}
.bell-badge{position:absolute;top:-6px;right:-10px;background:var(--bad);color:#fff;font-size:.6rem;font-weight:800;border-radius:10px;padding:1px 5px;line-height:1;}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap;}
.tab{font-size:.75rem;padding:7px 12px;border-radius:20px;border:1px solid #232841;color:var(--sub);cursor:pointer;user-select:none;}
.tab.on{color:#0d0f16;background:linear-gradient(90deg,var(--teal),var(--pink));border:none;font-weight:700;}
.card{background:var(--card);border:1px solid #1e2338;border-radius:18px;padding:16px 18px;margin-bottom:14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .15s ease;}
.card:active{transform:scale(.98);}
.card h4{margin:8px 0 4px;font-size:1rem;font-weight:700;}
.card p{margin:2px 0;font-size:.82rem;color:var(--sub);}
.card p{margin:0;color:var(--sub);font-size:.78rem;line-height:1.5;}
.badge{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:8px;margin-bottom:6px;}
.b-nouveau{background:rgba(242,201,76,.15);color:var(--wait);}
.b-valide{background:rgba(94,224,106,.15);color:var(--ok);}
.b-refuse{background:rgba(255,92,92,.15);color:var(--bad);}
.b-en_attente{background:rgba(242,201,76,.15);color:var(--wait);}
.empty{text-align:left;color:var(--sub);font-size:.85rem;padding:20px 0;}
#gate{max-width:320px;margin:80px auto;text-align:left;}
#gate input{width:100%;background:#0f1220;border:1px solid #262c47;color:var(--text);border-radius:10px;padding:11px 12px;font-size:.9rem;margin:10px 0;}
#gate label{display:block;font-size:.78rem;color:var(--sub);margin:10px 0 4px;}
.pwrap{position:relative;}
.pwrap input{padding-right:42px;}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;font-size:1rem;opacity:.75;}
.link{font-size:.8rem;color:var(--teal);text-align:right;cursor:pointer;margin:4px 0 4px;}
.msg-ok{color:var(--ok);font-size:.78rem;}
.msg-bad{color:var(--bad);font-size:.78rem;}
.btn{padding:12px;border-radius:12px;border:none;font-weight:700;font-size:.86rem;cursor:pointer;width:100%;}
.btn.primary{background:linear-gradient(90deg,var(--teal),var(--pink));color:#0d0f16;}
.btn.ghost{background:transparent;border:1px solid #2c3350;color:#dfe2ee;}
.btn.bad{background:var(--bad);color:#160404;}
.overlay{position:fixed;inset:0;background:rgba(6,7,12,.72);z-index:30;display:none;align-items:flex-end;justify-content:center;}
.overlay.on{display:flex;}
.sheet{background:var(--card);border-top:1px solid #1e2338;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));}
.sheet h3{margin:0 0 10px;}
.sheet .row{font-size:.85rem;line-height:1.7;color:#dfe2ee;text-align:left;margin-bottom:2px;}
.sheet .row b{color:var(--teal);}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #262c47;}
.actions{display:flex;gap:10px;margin-top:16px;}
.actions .btn{flex:1;}
.close{float:right;color:var(--sub);font-size:1.1rem;cursor:pointer;}
.plan{margin-top:14px;background:#0f1220;border:1px solid #262c47;border-radius:12px;padding:12px 14px;}
.plan h4{margin:0 0 8px;font-size:.85rem;color:var(--teal);}
.plan ol{margin:0;padding-left:18px;font-size:.8rem;line-height:1.7;color:#dfe2ee;text-align:left;}
.wa-btn{display:block;text-align:center;text-decoration:none;margin-top:10px;padding:11px;border-radius:10px;background:#25d366;color:#062012;font-weight:700;font-size:.82rem;}
.note{font-size:.72rem;color:var(--sub);margin-top:8px;line-height:1.5;text-align:left;}
</style>
</head>
<body>

<nav><div class="navwrap"><b>🔧 PC-INFORMATIQUE — Admin</b><span class="headright"><span id="count" style="font-size:.75rem;color:var(--sub)"></span><span class="bell" id="admin-bell" title="Notifications">&#128276;<span class="bell-badge" id="admin-bell-badge" style="display:none;"></span></span></span></div></nav>

<div id="gate" class="wrap">
  <h3 style="text-align:left">Accès admin</h3>
  <p style="color:var(--sub);font-size:.82rem;text-align:left">Connectez-vous avec votre compte admin.</p>
  <label>E-mail</label>
  <input type="email" id="login-email" placeholder="votre@email.com" autocomplete="username">
  <label>Mot de passe</label>
  <div class="pwrap">
    <input type="password" id="login-pass" placeholder="Mot de passe" autocomplete="current-password">
    <span class="eye" id="eye-toggle">👁️</span>
  </div>
  <div class="link" id="forgot-link">Mot de passe oublié ?</div>
  <button class="btn primary" id="btn-enter">Se connecter</button>
  <p id="gate-msg" style="display:none;margin-top:10px;"></p>
</div>

<div class="wrap" id="dash" style="display:none">
  <div style="text-align:right;margin:14px 0 -6px"><span class="link" id="btn-logout">Se déconnecter</span></div>
  <div class="modebar" style="display:flex;gap:8px;margin:14px 0;">
    <div class="tab on" id="mode-demandes">Demandes</div>
    <div class="tab" id="mode-projets">Projets membres</div>
  </div>
  <div id="sec-demandes">
  <div class="tabs">
    <div class="tab on" data-f="nouveau">🕓 Nouvelles</div>
    <div class="tab" data-f="valide">✅ Validées</div>
    <div class="tab" data-f="refuse">❌ Refusées</div>
    <div class="tab" data-f="all">Toutes</div>
  </div>
  <div id="list"></div>
  </div>
  <div id="sec-projets" style="display:none">
    <div class="tabs">
      <div class="tab on" data-fp="en_attente">En attente</div>
      <div class="tab" data-fp="valide">Valides</div>
      <div class="tab" data-fp="refuse">Refuses</div>
      <div class="tab" data-fp="all">Tous</div>
    </div>
    <div id="list-projets"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
// ============ CONFIG — identique à index.html ============
const firebaseConfig = { apiKey:"AIzaSyCx2D6b8TFGW-GBxb25t4MUqpoQj_cQCtk", authDomain:"pc-informatique-site.firebaseapp.com", projectId:"pc-informatique-site", storageBucket:"pc-informatique-site.firebasestorage.app", messagingSenderId:"43208715297", appId:"1:43208715297:web:02e946d321ae3a31ab0760" };
const EMAILJS_PUBLIC_KEY="iY7b9HdZI_G99qvhw", EMAILJS_SERVICE_ID="service_27up0fb", EMAILJS_TPL_CLIENT_OK="template_s55092f", EMAILJS_TPL_CLIENT_NO="template_35h5az2";
const EMAILJS_READY = EMAILJS_PUBLIC_KEY !== "REMPLACER";
// ===========================================================

// ---- Feuille de route : outils gratuits selon le type + fonctionnalités choisies ----
const TOOL_MAP = {
  type: {
    "Site vitrine": ["Hébergement gratuit : GitHub Pages ou Firebase Hosting", "Structure HTML/CSS/JS sur mesure"],
    "Site e-commerce / boutique en ligne": ["Firebase Hosting + Firestore (catalogue produits)", "Commande via lien Mobile Money ou WhatsApp"],
    "Application mobile": ["PWA installable (manifest.json + service worker)", "Firebase Hosting"],
    "PWA (application web installable)": ["Firebase Hosting", "manifest.json + service worker (installable)", "Firebase Firestore pour les données"],
    "Logiciel de gestion (caisse, stock)": ["Firebase Firestore (base de données temps réel)", "Firebase Authentication (comptes utilisateurs)"],
    "Autre": ["Outils à définir selon le besoin précis du client"]
  },
  features: {
    "Formulaire de contact": ["EmailJS (envoi d'e-mails gratuit)"],
    "Paiement en ligne / Mobile Money": ["Lien direct Airtel Money / Moov Money", "PayPal pour les paiements internationaux"],
    "Espace client / connexion": ["Firebase Authentication (gratuit)"],
    "Panneau d'administration": ["Page admin.html sécurisée reliée à Firestore (comme celle-ci)"],
    "Notifications": ["EmailJS (e-mail) + lien WhatsApp (wa.me) pour notification manuelle instantanée"],
    "Carte / géolocalisation": ["Leaflet.js + fonds de carte OpenStreetMap (gratuit)"],
    "Multilingue": ["Dictionnaires JS i18n faits main (gratuit, sans service tiers)"]
  }
};
function buildPlan(d){
  const steps = new Set();
  (TOOL_MAP.type[d.type]||[]).forEach(s=>steps.add(s));
  (d.features||[]).forEach(f=>(TOOL_MAP.features[f]||[]).forEach(s=>steps.add(s)));
  return [...steps];
}

// ---- Firebase ----
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
let db = firebase.firestore();

// ---- Œil afficher/masquer ----
document.getElementById('eye-toggle').addEventListener('click', ()=>{
  const inp = document.getElementById('login-pass');
  const eye = document.getElementById('eye-toggle');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  eye.textContent = show ? '🙈' : '👁️';
});

function gateMsg(text, ok){
  const m = document.getElementById('gate-msg');
  m.textContent = text; m.className = ok ? 'msg-ok' : 'msg-bad'; m.style.display = 'block';
}

// ---- Connexion ----
document.getElementById('btn-enter').addEventListener('click', ()=>{
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if(!email || !pass){ gateMsg('Renseignez e-mail et mot de passe.', false); return; }
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    gateMsg(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
      ? 'E-mail ou mot de passe incorrect.' : 'Erreur de connexion : ' + err.message, false);
  });
});

// ---- Mot de passe oublié ----
document.getElementById('forgot-link').addEventListener('click', ()=>{
  const email = document.getElementById('login-email').value.trim();
  if(!email){ gateMsg('Entrez d\'abord votre e-mail ci-dessus, puis touchez à nouveau "Mot de passe oublié ?".', false); return; }
  auth.sendPasswordResetEmail(email).then(()=>{
    gateMsg('E-mail de réinitialisation envoyé à ' + email + '. Vérifiez votre boîte de réception.', true);
  }).catch(err=>{
    gateMsg(err.code === 'auth/user-not-found' ? 'Aucun compte admin avec cet e-mail.' : 'Erreur : ' + err.message, false);
  });
});

// ---- Déconnexion ----
document.getElementById('btn-logout').addEventListener('click', ()=> auth.signOut());

// ---- Bascule gate/dash selon l'état de connexion ----
const ADMIN_UID = "QFC18HxRAZabqYD85S5eA7VLC5D3";
auth.onAuthStateChanged(user=>{
  if(user && user.uid === ADMIN_UID){
    document.getElementById('gate').style.display='none';
    document.getElementById('dash').style.display='block';
    loadList();
    loadProjets();
    startAdminNotifs();
  } else if(user){
    auth.signOut();
    gateMsg("Ce compte n'a pas les droits administrateur.", false);
  } else {
    document.getElementById('gate').style.display='block';
    document.getElementById('dash').style.display='none';
  }
});
let ALL=[]; let filter='nouveau';
function loadList(){
  if(!db) return;
  db.collection('demandes').orderBy('createdAt','desc').onSnapshot(snap=>{
    ALL = snap.docs.map(doc=>({id:doc.id, ...doc.data()}));
    document.getElementById('count').textContent = ALL.length + ' demande(s)';
    render();
    const urlId = new URLSearchParams(location.search).get('id');
    if(urlId){ const d = ALL.find(x=>x.id===urlId); if(d) openSheet(d); }
  });
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  filter = t.dataset.f; render();
}));
function render(){
  const list = document.getElementById('list');
  const items = filter==='all' ? ALL : ALL.filter(d=>d.status===filter);
  if(!items.length){ list.innerHTML = '<div class="empty">Aucune demande ici pour le moment.</div>'; return; }
  list.innerHTML = items.map(d=>`
    <div class="card" onclick="openSheet(${JSON.stringify(d).replace(/"/g,'&quot;')})">
      <span class="badge b-${d.status}">${d.status}</span>
      <h4>${d.nom||'Sans nom'} — ${d.structure||''}</h4>
      <p>${d.type||'-'} · ${d.secteur||'-'} · ${d.tel||''}</p>
    </div>`).join('');
}

// ---- Fiche détail ----
function openSheet(d){
  const overlay = document.getElementById('overlay');
  const plan = d.plan || buildPlan(d);
  document.getElementById('sheet').innerHTML = `
    <span class="close" onclick="closeSheet()">✕</span>
    <span class="badge b-${d.status}">${d.status}</span>
    <h3>${d.nom||'-'}</h3>
    <div class="row"><b>Tél :</b> ${d.tel||'-'} ${d.email?('· <b>Email :</b> '+d.email):''}</div>
    <div class="row"><b>Structure :</b> ${d.structure||'-'} (${d.secteur||'-'}, ${d.ville||'-'})</div>
    <div class="row"><b>Type :</b> ${d.type||'-'}</div>
    <div class="row"><b>Fonctionnalités :</b> ${(d.features||[]).join(', ')||'-'}</div>
    <div class="row"><b>Description :</b> ${d.description||'-'}</div>
    <div class="row"><b>Budget :</b> ${d.budget||'-'} · <b>Délai :</b> ${d.delai||'-'}</div>
    <div class="row"><b>Nom commercial :</b> ${d.nomCommercial||'-'} · <b>Slogan :</b> ${d.slogan||'-'}</div>
    <div class="row"><b>Devise :</b> ${d.devise||'-'} · <b>Couleurs :</b> ${d.couleur1||''} / ${d.couleur2||''}</div>
    <div class="row"><b>Textes fournis :</b> ${d.textes ? d.textes : '—'}</div>
    <div class="thumbs">${(d.images||[]).map(i=>`<img src="${i}">`).join('')}</div>
    <div class="plan"><h4>🛠️ Feuille de route (outils gratuits)</h4><ol>${plan.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    ${d.status==='nouveau' ? `
      <div class="actions">
        <button class="btn primary" onclick="decide('${d.id}','valide')">Valider</button>
        <button class="btn bad" onclick="decide('${d.id}','refuse')">Refuser</button>
      </div>` : `
      <a class="wa-btn" id="wa-resend" href="#" target="_blank">📲 Renvoyer la notification WhatsApp au client</a>
    `}
    <p class="note">La notification WhatsApp au client s'ouvre en un tap dans WhatsApp (le numéro client n'étant pas relié à un compte professionnel automatisé, l'envoi se confirme manuellement). L'e-mail, lui, part automatiquement si un e-mail est renseigné.</p>
  `;
  overlay.classList.add('on');
  if(d.status!=='nouveau'){
    const msg = d.status==='valide' ? clientMsgOk(d) : clientMsgRefuse(d);
    document.getElementById('wa-resend').href = `https://wa.me/${cleanTel(d.tel)}?text=${encodeURIComponent(msg)}`;
  }
  window._current = d;
}
function closeSheet(){ document.getElementById('overlay').classList.remove('on'); history.replaceState(null,'','admin.html'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

function cleanTel(t){ return (t||'').replace(/[^0-9+]/g,'').replace(/^0/,'241').replace('+',''); }

function clientMsgOk(d){
  const plan = d.plan || buildPlan(d);
  return `Bonjour ${d.nom}, bonne nouvelle ! ✅\nVotre demande "${d.nomCommercial||d.structure||d.type}" auprès de PC-INFORMATIQUE est *validée*.\nNous démarrons la réalisation. Étapes prévues :\n${plan.map((s,i)=>`${i+1}. ${s}`).join('\n')}\nNous revenons vers vous dès l'avancement. Merci de votre confiance !`;
}
function clientMsgRefuse(d){
  return `Bonjour ${d.nom}, merci pour votre demande auprès de PC-INFORMATIQUE.\nAprès étude, nous ne pouvons pas la prendre en charge dans l'état actuel. N'hésitez pas à nous recontacter pour en discuter ou préciser votre besoin.\n✉️ pcinformatique28@gmail.com · 📞 +241 60 14 19 24`;
}

function decide(id, status){
  const d = ALL.find(x=>x.id===id);
  if(!d) return;
  const plan = status==='valide' ? buildPlan(d) : null;
  const update = { status, decidedAt: new Date().toISOString() };
  if(plan) update.plan = plan;
  db.collection('demandes').doc(id).update(update).then(()=>{
    const updated = {...d, ...update};
    // E-mail auto au client si adresse fournie
    if(EMAILJS_READY && window.emailjs && d.email){
      try{
        emailjs.init(EMAILJS_PUBLIC_KEY);
        const tpl = status==='valide' ? EMAILJS_TPL_CLIENT_OK : EMAILJS_TPL_CLIENT_NO;
        emailjs.send(EMAILJS_SERVICE_ID, tpl, { to_email:d.email, nom:d.nom, message: status==='valide'?clientMsgOk(updated):clientMsgRefuse(updated) });
      }catch(e){ console.error(e); }
    }
    closeSheet();
    openSheet(updated);
  });
}

let ALLP = []; let filterP = 'en_attente';
function loadProjets(){
  if(!db) return;
  db.collection('projets').orderBy('createdAt','desc').onSnapshot(snap=>{
    ALLP = snap.docs.map(doc=>({id:doc.id, ...doc.data()}));
    renderProjets();
  });
}
function renderProjets(){
  const list = document.getElementById('list-projets');
  const items = filterP==='all' ? ALLP : ALLP.filter(p=>p.statut===filterP);
  if(!items.length){ list.innerHTML = '<div class="empty">Aucun projet ici pour le moment.</div>'; return; }
  list.innerHTML = items.map(p=>`
    <div class="card">
      <span class="badge b-${p.statut}">${p.statut}</span>
      <h4>${p.titre||'Sans titre'}</h4>
      <p>${p.type||'-'}</p>
      <p>${p.description||''}</p>
      ${p.imageURL ? `<div class="thumbs"><img src="${p.imageURL}"></div>` : ''}
      ${p.lien ? `<p><a href="${p.lien}" target="_blank" style="color:var(--teal)">${p.lien}</a></p>` : ''}
      ${p.statut==='en_attente' ? `
        <div class="actions">
          <button class="btn primary" onclick="decideProjet('${p.id}','valide')">Valider</button>
          <button class="btn bad" onclick="decideProjet('${p.id}','refuse')">Refuser</button>
        </div>` : ''}
    </div>`).join('');
}
document.querySelectorAll('#sec-projets .tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('#sec-projets .tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  filterP = t.dataset.fp; renderProjets();
}));
function decideProjet(id, status){
  db.collection('projets').doc(id).update({ statut: status, decidedAt: new Date().toISOString(), vu: false });
}
document.getElementById('mode-demandes').addEventListener('click', ()=>{
  document.getElementById('mode-demandes').classList.add('on');
  document.getElementById('mode-projets').classList.remove('on');
  document.getElementById('sec-demandes').style.display='block';
  document.getElementById('sec-projets').style.display='none';
});
document.getElementById('mode-projets').addEventListener('click', ()=>{
  document.getElementById('mode-projets').classList.add('on');
  document.getElementById('mode-demandes').classList.remove('on');
  document.getElementById('sec-demandes').style.display='none';
  document.getElementById('sec-projets').style.display='block';
});

let notifDemandesCount = 0, notifProjetsCount = 0;
function startAdminNotifs(){
  db.collection('demandes').where('status','==','nouveau').onSnapshot(snap=>{
    notifDemandesCount = snap.size;
    updateAdminBell();
  });
  db.collection('projets').where('statut','==','en_attente').onSnapshot(snap=>{
    notifProjetsCount = snap.size;
    updateAdminBell();
  });
}
function updateAdminBell(){
  const badge = document.getElementById('admin-bell-badge');
  if(!badge) return;
  const total = notifDemandesCount + notifProjetsCount;
  if(total>0){ badge.textContent = total; badge.style.display='inline-block'; }
  else{ badge.style.display='none'; }
}
</script>

</html>
